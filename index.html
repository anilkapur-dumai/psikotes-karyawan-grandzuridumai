<!DOCTYPE html>
<html lang="id">

<title>Psikotes Karyawan - Grand Zuri Dumai</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#16243a;--muted:#667085;--line:#e4e0d7;--pri:#1d4e89;--gold:#b8892d;--ok:#1f8a5b;--warn:#c27c0e;--bad:#c2410c}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:600px;margin:0 auto;padding:20px 18px 56px}
h1{font-size:26px;line-height:1.2;margin:6px 0 10px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)} .note{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:16px;background:#fff;color:var(--ink)}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;font-size:16px;background:var(--pri);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold)} .btn.wa{background:#25D366}
.btn+.btn,.btn+a.btn,a.btn+.btn{margin-top:10px}
.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.steps{display:flex;gap:6px;margin:6px 0 18px}
.steps span{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.steps span i{position:absolute;inset:0;width:0;background:var(--pri);transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.q{font-size:19px;font-weight:700;line-height:1.4;margin:4px 0 18px}
.lik{display:grid;gap:8px}

.lik button.sel b{background:var(--pri);color:#fff}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:12px 0}

.row:last-child{border:0} .row b{text-align:right}
.tr{margin:12px 0}
.tr .h{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.bar{height:9px;background:#eceae4;border-radius:9px;margin:6px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.tr p{margin:2px 0;font-size:13px;color:var(--muted)}
.card p{margin:8px 0}
ul{padding-left:20px;margin:6px 0} li{margin:5px 0;font-size:14px}
.tests button{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;font:inherit;color:var(--ink);cursor:pointer}
.tests .ic{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#eef3fb}
.tests b{display:block;font-size:16px}
.tests .st{font-size:12px;font-weight:700;margin-top:4px}
.tests .done{border-color:#bfe3d0;background:#f6fbf8}
.hist button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font:inherit;cursor:pointer;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.fade{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
body.lock .q,body.lock .lik{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi .t{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.kpi .t i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 30px}
.kpi .t i svg{width:16px;height:16px}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi .v{font-size:34px;font-weight:800;line-height:1.1;margin-top:8px}.kpi .v small{font-size:12px;color:var(--muted);font-weight:600}
.kpi .w{font-size:18px;font-weight:800;line-height:1.2;margin:10px 0 6px}
.kpi .st{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.hd{display:flex;align-items:center;gap:10px}.hd i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 30px}.hd i svg{width:16px;height:16px}
.top3{display:grid;gap:8px}.top3 div{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.top3 b.n{width:24px;height:24px;border-radius:50%;background:var(--muted);color:#fff;display:grid;place-items:center;font-size:12px}
.top3 div:first-child{background:#e9f0fa;border-color:#c9d8ef}.top3 div:first-child b.n{background:var(--pri)}
.top3 span{flex:1;font-weight:700}
.link{background:none;border:0;color:var(--pri);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
</style>
</head>

// Kode hasil dienkripsi (RSA-OAEP 2048 + AES-GCM 256). Hanya bisa dibuka di mode HRD dengan password.
const te=new TextEncoder(),td=new TextDecoder();
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=buf=>{let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const b64ud=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return b64d(s);};
const hasCrypto=()=>!!(window.crypto&&crypto.subtle);
async function encryptPayload(obj){
 const S=crypto.subtle;
 const pub=await S.importKey('spki',b64d(PUBKEY),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
 const k=await S.generateKey({name:'AES-GCM',length:256},true,['encrypt']);
 const ek=await S.encrypt({name:'RSA-OAEP'},pub,await S.exportKey('raw',k));
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await S.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(obj)));
 return 'HT5.'+b64u(ek)+'.'+b64u(iv)+'.'+b64u(ct);
}
async function unlockKey(pw){
 const S=crypto.subtle;
 const base=await S.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await S.deriveKey({name:'PBKDF2',salt:b64d(VAULT.salt),iterations:VAULT.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const pk=await S.decrypt({name:'AES-GCM',iv:b64d(VAULT.iv)},key,b64d(VAULT.data));
 return S.importKey('pkcs8',pk,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);
}
const CODE_RE=/HT5\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)/;
async function decode(text,priv){
 const m=(text||'').replace(/\s+/g,'').match(CODE_RE);
 if(!m)throw new Error('Kode tidak ditemukan. Pastikan seluruh kode tersalin, diawali "HT5."');
 let o;
 try{const S=crypto.subtle;const raw=await S.decrypt({name:'RSA-OAEP'},priv,b64ud(m[1]));
  const k=await S.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  o=JSON.parse(td.decode(await S.decrypt({name:'AES-GCM',iv:b64ud(m[2])},k,b64ud(m[3]))));}
 catch(e){throw new Error('Kode tidak valid, terpotong, atau telah diubah.');}
 if(!o.a||o.sd==null)throw new Error('Isi kode tidak lengkap.');
 if(o.b!==BANK_VER)throw new Error('Kode ini berasal dari versi tes yang berbeda. Buka dengan file tes versi yang sama saat peserta mengerjakan.');
 o.items=buildItems(o.sd,o.lv);
 if(o.a.length!==o.items.length)throw new Error('Jawaban dalam kode tidak lengkap.');
 o.code=m[0];return o;
}

  else{sum[key]=(sum[key]||0)+(it.rev?6-a[i]:a[i]);cnt[key]=(cnt[key]||0)+1;}});
 const avg=key=>norm(sum[key]/cnt[key]);

 if(inTot<60)SENS.forEach(x=>{fin[x]=Math.min(fin[x],44);});

 if(o.s&&o.s<IT.length*FAST_PER_ITEM)f.push(['warn','Diselesaikan sangat cepat ('+(Math.round(o.s/6)/10)+' menit). Kemungkinan kurang membaca soal.']);
 const valid=(f.some(x=>x[0]==='bad')||f.length>=2)?'bad':f.length?'warn':'ok';

function reportHTML(B){

 });
 close();return h;
}

const ascii=s=>String(s==null?'':s).replace(/[\u2013\u2014]/g,'-').replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'").replace(/\u00B7/g,'|').replace(/\u2026/g,'...').replace(/[\u00C0-\u00C5]/g,'A').replace(/[\u00E0-\u00E5]/g,'a').replace(/[\u00E8-\u00EB]/g,'e').replace(/[\u00C8-\u00CB]/g,'E').replace(/[^\x20-\x7E]/g,'');
function MiniPDF(){
 const W=595.28,H=841.89,pages=[],imgs={};let cur=null,curImgs=null;
 const f=n=>(Math.round(n*100)/100).toString();
 const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(f).join(' ');
 const Y=y=>H-y;
 const api={W,H,
  page(){cur=[];curImgs=new Set();cur.imgs=curImgs;pages.push(cur);return api;},
  image(key,x,y,w,h){if(!imgs[key])imgs[key]={src:LOGO[key],id:0};curImgs.add(key);cur.push(`q ${f(w)} 0 0 ${f(h)} ${f(x)} ${f(Y(y+h))} cm /Im_${key} Do Q`);return api;},
  op(s){cur.push(s);},
  fill(h){cur.push(rgb(h)+' rg');return api;},stroke(h){cur.push(rgb(h)+' RG');return api;},lw(w){cur.push(f(w)+' w');return api;},
  rect(x,y,w,h,m='f'){cur.push(`${f(x)} ${f(Y(y+h))} ${f(w)} ${f(h)} re ${m}`);return api;},
  rrect(x,y,w,h,r,m='f'){r=Math.min(r,w/2,h/2);const k=0.5523*r,x2=x+w,y2=y+h;
   cur.push([`${f(x+r)} ${f(Y(y))} m`,`${f(x2-r)} ${f(Y(y))} l`,`${f(x2-r+k)} ${f(Y(y))} ${f(x2)} ${f(Y(y+r-k))} ${f(x2)} ${f(Y(y+r))} c`,`${f(x2)} ${f(Y(y2-r))} l`,`${f(x2)} ${f(Y(y2-r+k))} ${f(x2-r+k)} ${f(Y(y2))} ${f(x2-r)} ${f(Y(y2))} c`,`${f(x+r)} ${f(Y(y2))} l`,`${f(x+r-k)} ${f(Y(y2))} ${f(x)} ${f(Y(y2-r+k))} ${f(x)} ${f(Y(y2-r))} c`,`${f(x)} ${f(Y(y+r))} l`,`${f(x)} ${f(Y(y+r-k))} ${f(x+r-k)} ${f(Y(y))} ${f(x+r)} ${f(Y(y))} c`,m].join(' '));return api;},
  circle(cx,cy,r,m='f'){const k=0.5523*r;cur.push([`${f(cx+r)} ${f(Y(cy))} m`,`${f(cx+r)} ${f(Y(cy-k))} ${f(cx+k)} ${f(Y(cy-r))} ${f(cx)} ${f(Y(cy-r))} c`,`${f(cx-k)} ${f(Y(cy-r))} ${f(cx-r)} ${f(Y(cy-k))} ${f(cx-r)} ${f(Y(cy))} c`,`${f(cx-r)} ${f(Y(cy+k))} ${f(cx-k)} ${f(Y(cy+r))} ${f(cx)} ${f(Y(cy+r))} c`,`${f(cx+k)} ${f(Y(cy+r))} ${f(cx+r)} ${f(Y(cy+k))} ${f(cx+r)} ${f(Y(cy))} c`,m].join(' '));return api;},
  poly(pts,m='f'){cur.push(pts.map((p,i)=>`${f(p[0])} ${f(Y(p[1]))} ${i?'l':'m'}`).join(' ')+(m==='S'?' S':' h '+m));return api;},
  line(x1,y1,x2,y2){cur.push(`${f(x1)} ${f(Y(y1))} m ${f(x2)} ${f(Y(y2))} l S`);return api;},
  width(s,size,ft='H'){s=ascii(s);let t=0;for(const ch of s){const c=ch.charCodeAt(0);t+=FW[ft][c-32]||556;}return t*size/1000;},
  wrap(s,size,ft,maxw){const words=ascii(s).split(/\s+/).filter(Boolean),lines=[];let ln='';
   words.forEach(w=>{const t=ln?ln+' '+w:w;if(api.width(t,size,ft)>maxw&&ln){lines.push(ln);ln=w;}else ln=t;});if(ln)lines.push(ln);return lines;},
  text(s,x,y,size=10,ft='H',color='#16243a',align='left'){s=ascii(s);let xx=x;const w=api.width(s,size,ft);if(align==='right')xx=x-w;else if(align==='center')xx=x-w/2;
   const e=s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
   cur.push(`BT ${rgb(color)} rg /F${'HBI'.indexOf(ft)+1} ${f(size)} Tf ${f(xx)} ${f(Y(y))} Td (${e}) Tj ET`);return api;},
  output(){const objs=[];const add=s=>{objs.push(s);return objs.length;};
   const fonts=['H','B','I'].map(k=>add(`<< /Type /Font /Subtype /Type1 /BaseFont /${FN[k]} /Encoding /WinAnsiEncoding >>`));
   for(const k in imgs){const bin=atob(imgs[k].src.jpg);imgs[k].id=add(`<< /Type /XObject /Subtype /Image /Width ${imgs[k].src.w} /Height ${imgs[k].src.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n${bin}\nendstream`);}
   const pagesId=objs.length+1;add('');const kids=[];
   pages.forEach(p=>{const c=p.join('\n');const cid=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${fonts[0]} 0 R /F2 ${fonts[1]} 0 R /F3 ${fonts[2]} 0 R >> /XObject << ${[...p.imgs].map(k=>`/Im_${k} ${imgs[k].id} 0 R`).join(' ')} >> >> /Contents ${cid} 0 R >>`));});
   objs[pagesId-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
   const cat=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
   let out='%PDF-1.4\n';const off=[];objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`;});
   const x=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
   out+=`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${x}\n%%EOF`;
   const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;return b;}};
 return api;
}

// Ikon vektor putih di dalam lingkaran berwarna
function icon(p,name,cx,cy,r,bg){
 p.fill(bg).circle(cx,cy,r);p.fill('#ffffff').stroke('#ffffff');const s=r/9;p.lw(1.3*s);
 const P=(x,y)=>[cx+x*s,cy+y*s];
 switch(name){
  case 'target':p.circle(cx,cy,5.2*s,'S').circle(cx,cy,2.6*s,'S').circle(cx,cy,0.9*s);break;
  case 'shield':p.poly([P(0,-5.5),P(4.6,-3.6),P(4.2,1.2),P(0,5.6),P(-4.2,1.2),P(-4.6,-3.6)]);p.stroke(bg).lw(1.3*s).poly([P(-2,0),P(-0.5,1.6),P(2.4,-1.8)],'S');break;

  <label>Departemen</label><select id="d"><option value="">Pilih departemen</option>${opt}</select>
  <label>Level jabatan</label><select id="lv"><option value="">Pilih level</option>${Object.keys(LV).map(k=>`<option value="${k}" ${st.info.lv===k?'selected':''}>${LV[k]}</option>`).join('')}</select>
  <label>Tujuan tes</label><select id="p"><option value="">Pilih tujuan</option>${Object.keys(PURP).map(k=>`<option value="${k}" ${st.info.p===k?'selected':''}>${PURP[k]}</option>`).join('')}</select>
  <div class="err" id="er"></div></div>
 <button class="btn" id="go">${st.ans.length?'Lanjutkan tes':'Lanjut'}</button>
 ${st.ans.length?'<button class="btn ghost" id="rs">Mulai dari awal</button>':''}
 <p class="note" style="margin-top:28px">Petugas HRD? <a class="link" href="#hrd">Buka mode HRD</a></p></div>`;
 document.getElementById('go').onclick=()=>{const v=id=>document.getElementById(id).value.trim();
  const info={n:v('n'),j:v('j'),d:v('d'),p:v('p'),lv:v('lv')};
  if(!info.n||!info.j||!info.d||!info.p||!info.lv){document.getElementById('er').textContent='Lengkapi semua data terlebih dahulu.';return;}
  if(st.ans.length&&!st.code&&info.lv!==st.info.lv){st.ans=[];st.i=0;st.sd=0;}
  if(st.code&&(info.lv!==st.info.lv||info.n!==st.info.n)){st=fresh();}
  st.info=info;st.view=st.code?'done':st.ans.length?'q':'guide';render();};
 const rs=document.getElementById('rs');if(rs)rs.onclick=()=>{st=fresh();render();};
}
function guide(){
 if(!st.sd)st.sd=newSeed();
 const IT=items(),si=IT._si;
 app.innerHTML=`<div class="fade"><div class="eyebrow">Petunjuk</div><h1>Sebelum mulai</h1>
 <div class="card"><p style="margin-top:0">Ada <b>${IT.length} soal</b> dalam <b>${si.list.length} sesi</b> yang berlanjut otomatis, sekitar <b>${Math.round(IT.length*0.18)}–${Math.round(IT.length*0.23)} menit</b>:</p>
 <ul>${si.list.map(s=>`<li><b>Sesi ${s}: ${SES[s].nm}</b> (${si.c[s]} soal)</li>`).join('')}</ul>
 <ul><li>Jawab sesuai diri Anda yang sebenarnya, bukan yang dianggap ideal.</li>
 <li>Setiap peserta mendapat kombinasi soal yang berbeda, jadi kerjakan sendiri.</li>
 <li>Tes ini memiliki pengecekan konsistensi. Jawaban yang dibuat-buat justru membuat hasil tidak valid.</li>
 <li>Kerjakan di tempat yang tenang, sekali duduk.</li></ul></div>
 <button class="btn" id="go">Mulai sesi 1</button></div>`;
 document.getElementById('go').onclick=()=>{st.start=Date.now();st.view='q';render();};
}
function question(){
 const IT=items(),N=IT.length,si=IT._si,i=st.i,it=IT[i],s=it.s,cur=st.ans[i],sit=!!it.o,first=i===si.st[s];
 const firstSit=sit&&i>0&&!IT[i-1].o;
 const opts=sit?it.ord.map((oi,j)=>`<button data-v="${oi+1}" class="${cur===oi+1?'sel':''}"><b>${'ABCD'[j]}</b>${esc(it.o[oi][0])}</button>`).join('')
  :SES[s].scale.map((l,j)=>`<button data-v="${j+1}" class="${cur===j+1?'sel':''}"><b>${j+1}</b>${l}</button>`).join('');
 app.innerHTML=`<div class="fade"><div class="top"><span>Sesi ${s} dari ${si.list.length} · ${SES[s].nm}</span><span>${i+1}/${N}</span></div>${steps()}
 ${first||firstSit?`<div class="card" style="padding:12px 14px;margin:0 0 14px;background:#f6f8fc"><p class="note" style="margin:0">${firstSit?'Mulai di sini: pilih tindakan yang <b>paling mungkin Anda lakukan</b> dalam situasi berikut.':SES[s].ins}</p></div>`:''}
 ${sit?'<div class="note" style="font-weight:700;margin-bottom:4px">Situasi</div>':''}<div class="q">${esc(it.q)}</div>
 <div class="lik">${opts}</div><button class="back" id="bk">← ${i===0?'Kembali':'Soal sebelumnya'}</button></div>`;
 app.querySelectorAll('.lik button').forEach(b=>b.onclick=()=>{
  b.classList.add('sel');st.ans[i]=+b.dataset.v;st.i=i+1;
  if(st.i>=N){st.view='done';}else st.view=(sesOf(st.i)!==s)?'brk':'q';
  setTimeout(render,130);});
 document.getElementById('bk').onclick=()=>{if(i===0)st.view='guide';else st.i=i-1;render();};
}
function brk(){
 const nx=sesOf(st.i),prev=nx-1,si=items()._si,N=items().length,last=nx===si.list[si.list.length-1];
 app.innerHTML=`<div class="fade"><div class="top"><span>Istirahat sebentar</span><span>${st.i}/${N}</span></div>${steps()}
 <div class="card" style="text-align:center;padding:28px 18px"><div style="font-size:40px">${last?'💪':'👍'}</div><h2>Sesi ${prev} selesai</h2>
 <p class="muted">${last?'Tinggal satu sesi lagi.':'Bagus, lanjutkan.'} Berikutnya: <b style="color:var(--ink)">Sesi ${nx} · ${SES[nx].nm}</b> (${si.c[nx]} soal).</p></div>
 <button class="btn" id="go">Lanjut sesi ${nx}</button><button class="btn ghost" id="bk">Ubah jawaban terakhir</button></div>`;
 document.getElementById('go').onclick=()=>{st.view='q';render();};
 document.getElementById('bk').onclick=()=>{st.i--;st.view='q';render();};
}
let busy=false;
async function finish(){
 const s=st.start?Math.round((Date.now()-st.start)/1000):0;
 st.code=await encryptPayload({v:5,b:BANK_VER,sd:st.sd,lv:st.info.lv,n:st.info.n,j:st.info.j,d:st.info.d,p:st.info.p,t:new Date().toISOString().slice(0,10),s,a:st.ans.join('')});
 save();
}
const codeMsg=()=>`Kode hasil psikotes\nNama: ${st.info.n}\nJabatan: ${st.info.j}\nDepartemen: ${DEPTS[st.info.d].n}\nLevel: ${LV[st.info.lv]}\n\n${st.code}`;
function done(){
 if(!st.code){
  app.innerHTML=`<div class="fade"><div class="eyebrow">Selesai</div><h1>Menyiapkan kode hasil...</h1><p class="muted" id="em">Mohon tunggu sebentar.</p></div>`;
  if(!busy){busy=true;finish().then(()=>{busy=false;render();}).catch(e=>{busy=false;const em=document.getElementById('em');if(em)em.innerHTML='Kode gagal dibuat. Pastikan halaman dibuka melalui https://, lalu muat ulang halaman. Jawaban Anda tetap tersimpan.';console.error(e);});}
  return;}
 app.innerHTML=`<div class="fade"><div class="eyebrow">Selesai</div><h1>Terima kasih, ${esc(st.info.n.split(' ')[0])}.</h1>
 <p class="muted">Semua sesi sudah selesai. Langkah terakhir: kirim <b>kode hasil</b> di bawah ini ke HRD. Kode ini terkunci dan hanya bisa dibaca oleh HRD.</p>
 <div class="card"><div class="code">${esc(st.code)}</div></div>
 <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(codeMsg())}">Kirim ke HRD lewat WhatsApp</a>
 <button class="btn ghost" id="cp">Salin kode</button>
 <p class="note" style="margin-top:24px">Kode tersimpan di perangkat ini sampai Anda menekan tombol di bawah.</p>
 <button class="btn ghost" id="nw">Peserta baru (hapus data di perangkat ini)</button>
 <p class="note" style="margin-top:24px">Petugas HRD? <a class="link" href="#hrd" id="hr">Buka mode HRD</a></p></div>`;
 document.getElementById('cp').onclick=()=>copy(codeMsg());
 document.getElementById('nw').onclick=()=>{st=fresh();render();};
 document.getElementById('hr').onclick=()=>{pending=codeMsg();};
}

// ================= MODE HRD =================
let hrdSel=null,pending='';
function hist(){try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){return[]}}
function setHist(h){try{localStorage.setItem(HKEY,JSON.stringify(h.slice(0,300)))}catch(e){}}
let PRIV=null;
function hrdLogin(){
 app.innerHTML=`<div class="fade"><div class="eyebrow">Mode HRD</div><h1>Masuk</h1>
 <p class="muted">Masukkan password HRD untuk membuka hasil psikotes.</p>
 <div class="card"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="er"></div></div>
 <button class="btn" id="go">Masuk</button><a class="btn ghost" href="#" id="ex">Kembali ke halaman tes</a></div>`;
 const go=async()=>{const b=document.getElementById('go'),er=document.getElementById('er');
  if(!hasCrypto()){er.textContent='Halaman harus dibuka melalui https://.';return;}
  b.disabled=true;b.textContent='Memeriksa...';
  try{PRIV=await unlockKey(document.getElementById('pw').value);render();}
  catch(e){er.textContent='Password salah.';b.disabled=false;b.textContent='Masuk';}};
 document.getElementById('go').onclick=go;
 document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go();};
 document.getElementById('ex').onclick=e=>{e.preventDefault();history.replaceState(null,'',location.pathname+location.search);render();};
}
function hrd(){
 if(!PRIV)return hrdLogin();
 if(hrdSel)return hrdReport(hrdSel);
 const h=hist();
 app.innerHTML=`<div class="fade"><div class="eyebrow">Mode HRD</div><h1>Baca hasil psikotes</h1>
 <p class="muted">Tempel kode hasil dari peserta (diawali <b>HT5.</b>). Anda boleh menempel seluruh pesan WhatsApp-nya.</p>
 <div class="card"><textarea id="tx" placeholder="Tempel kode di sini">${esc(pending)}</textarea><div class="err" id="er"></div></div>
 <button class="btn" id="op">Tampilkan laporan</button>
 ${h.length?`<div class="card hist"><h2>Riwayat di perangkat ini</h2>${h.map((x,i)=>`<button data-i="${i}"><b>${esc(x.n)}</b> · ${esc(x.j)}<br><span class="note">${LV[x.lv]||''} · ${DEPTS[x.d]?DEPTS[x.d].n:''} · ${PURP[x.p]||''} · ${x.t}</span></button>`).join('')}</div>`:''}
 <p class="note">Riwayat hanya tersimpan di browser perangkat ini. Simpan PDF setiap laporan untuk arsip resmi.</p>
 <button class="btn ghost" id="lo">Keluar dari mode HRD</button></div>`;
 document.getElementById('op').onclick=async()=>{const er=document.getElementById('er');
  try{const o=await decode(document.getElementById('tx').value,PRIV);
   setHist([{n:o.n,j:o.j,d:o.d,p:o.p,lv:o.lv,t:o.t,code:o.code}].concat(hist().filter(x=>x.code!==o.code)));hrdSel=o;pending='';render();}
  catch(e){er.textContent=e.message||'Kode tidak bisa dibaca.';}};
 app.querySelectorAll('.hist button').forEach(b=>b.onclick=async()=>{try{hrdSel=await decode(h[+b.dataset.i].code,PRIV);render();}catch(e){toast('Kode rusak')}});
 document.getElementById('lo').onclick=()=>{PRIV=null;hrdSel=null;history.replaceState(null,'',location.pathname+location.search);render();};
}
function hrdReport(o){
 const R=buildReport(o);
 app.innerHTML=`<div class="fade"><button class="back" id="bk">← Daftar & tempel kode</button>
 <img src="data:image/jpeg;base64,${LOGO.gz.jpg}" alt="Grand Zuri Dumai" style="height:44px;margin:8px 0 14px;mix-blend-mode:multiply"><div class="eyebrow">Laporan psikotes · rahasia</div><h1>${esc(o.n)}</h1>
 <p class="muted" style="margin-top:-4px">${esc(o.j)} · ${DEPTS[o.d].n} · ${LV[o.lv]||''}</p>
 ${kpiHTML(R)}
 ${reportHTML(R.B)}
 <button class="btn gold" id="pdf">Unduh laporan PDF</button><button class="btn ghost" id="cp">Salin ringkasan teks</button>
 <p class="note" id="pn" style="margin-top:14px">Hasil tes ini adalah alat bantu, bukan diagnosis psikologis dan bukan satu-satunya dasar keputusan kepegawaian.</p></div>`;
 document.getElementById('bk').onclick=()=>{hrdSel=null;render();};
 document.getElementById('cp').onclick=()=>copy(summaryText(R));
 document.getElementById('pdf').onclick=e=>savePdf(R,e.target,document.getElementById('pn'));
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{hrdSel=null;render();});
render();
</script>
</body>
</html>
